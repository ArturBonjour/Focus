version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: neurotrack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: neurotrack
      POSTGRES_PASSWORD: neurotrack_secret
      POSTGRES_DB: neurotrack
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U neurotrack -d neurotrack']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - neurotrack_net

  backend:
    container_name: neurotrack_backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://neurotrack:neurotrack_secret@db:5432/neurotrack
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret_256}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret_256}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: 3001
      NODE_ENV: production
    ports:
      - '3001:3001'
    networks:
      - neurotrack_net

  frontend:
    container_name: neurotrack_frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      # Internal URL used by SSR (server-to-server inside Docker network)
      INTERNAL_API_URL: http://backend:3001/api
      NODE_ENV: production
    ports:
      - '3000:3000'
    networks:
      - neurotrack_net

volumes:
  pg_data:

networks:
  neurotrack_net:
    driver: bridge
